<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email tab QA</title>
  <script>
    window.originalLanguage = localStorage.getItem("deltaLanguage");
    localStorage.setItem("deltaLanguage", "en");
  </script>
  <style>
    html, body, #desktop{width:100%;height:100%;margin:0;border:0;}
    #mobile, #faroese{position:absolute;left:-10000px;width:390px;height:800px;border:0;}
  </style>
</head>
<body data-status="pending">
  <iframe id="desktop" src="products.html"></iframe>
  <iframe id="mobile" src="products.html?mobile-qa"></iframe>
  <pre id="result" hidden></pre>
  <script>
    function afterLoad(frame){
      return new Promise(resolve => {
        frame.addEventListener("load", () => resolve(frame.contentWindow), { once:true });
      });
    }

    Promise.all([
      afterLoad(document.getElementById("desktop")),
      afterLoad(document.getElementById("mobile"))
    ]).then(([desktopWindow, mobileWindow]) => {
      const link = desktopWindow.document.querySelector(".sales-team-float");
      const label = link.querySelector("span");
      const icon = link.querySelector("img");
      const collapsedRect = link.getBoundingClientRect();
      const collapsedLabelStyle = desktopWindow.getComputedStyle(label);
      const linkStyle = desktopWindow.getComputedStyle(link);

      const initialChecks = {
        collapsedWidth:Math.abs(collapsedRect.width - 76) < 2,
        fixedToRight:Math.abs(collapsedRect.right - desktopWindow.document.documentElement.clientWidth) < 2,
        straightTopRight:linkStyle.borderTopRightRadius === "0px",
        straightBottomRight:linkStyle.borderBottomRightRadius === "0px",
        labelInitiallyHidden:parseFloat(collapsedLabelStyle.opacity) === 0,
        iconSize:Math.abs(icon.getBoundingClientRect().width - 32) < 2 && Math.abs(icon.getBoundingClientRect().height - 32) < 2,
        destinationPreserved:link.getAttribute("href") === "contact.html#sales-team",
        mobileHidden:mobileWindow.getComputedStyle(mobileWindow.document.querySelector(".sales-team-float")).display === "none"
      };

      link.style.transition = "none";
      label.style.transition = "none";
      link.focus();

      setTimeout(() => {
        const expandedRect = link.getBoundingClientRect();
        const expandedLabelStyle = desktopWindow.getComputedStyle(label);
        const expandedChecks = {
          expandedWidth:Math.abs(expandedRect.width - 238) < 2,
          expandsOnlyLeft:Math.abs(expandedRect.right - collapsedRect.right) < 2
            && Math.abs((collapsedRect.left - expandedRect.left) - 162) < 2,
          heightUnchanged:Math.abs(expandedRect.height - collapsedRect.height) < 2,
          labelVisible:parseFloat(expandedLabelStyle.opacity) > 0.99 && label.textContent.trim() === "Send Inquiry",
          labelDoesNotWrap:expandedLabelStyle.whiteSpace === "nowrap",
          receivesKeyboardFocus:desktopWindow.document.activeElement === link
        };

        localStorage.setItem("deltaLanguage", "fo");
        const faroeseFrame = document.createElement("iframe");
        faroeseFrame.id = "faroese";
        faroeseFrame.src = "products.html?faroese-qa";
        document.body.appendChild(faroeseFrame);

        afterLoad(faroeseFrame).then(faroeseWindow => {
          const translatedLabel = faroeseWindow.document.querySelector(".sales-team-float span").textContent.trim();
          const checks = {
            ...initialChecks,
            ...expandedChecks,
            faroeseTranslation:translatedLabel === "Send fyrispurning"
          };
          const details = {
            viewportWidth:desktopWindow.innerWidth,
            layoutViewportWidth:desktopWindow.document.documentElement.clientWidth,
            collapsedRect:{left:collapsedRect.left, right:collapsedRect.right, width:collapsedRect.width, height:collapsedRect.height},
            expandedRect:{left:expandedRect.left, right:expandedRect.right, width:expandedRect.width, height:expandedRect.height},
            collapsedOpacity:collapsedLabelStyle.opacity,
            expandedOpacity:expandedLabelStyle.opacity,
            iconRect:{width:icon.getBoundingClientRect().width, height:icon.getBoundingClientRect().height},
            activeElement:desktopWindow.document.activeElement?.className || desktopWindow.document.activeElement?.tagName
          };

          if(window.originalLanguage === null){
            localStorage.removeItem("deltaLanguage");
          }else{
            localStorage.setItem("deltaLanguage", window.originalLanguage);
          }

          document.body.dataset.status = Object.values(checks).every(Boolean) ? "passed" : "failed";
          document.getElementById("result").textContent = JSON.stringify({checks, details});
        });
      }, 500);
    }).catch(error => {
      document.body.dataset.status = "error";
      document.getElementById("result").textContent = error.stack || error.message;
    });
  </script>
</body>
</html>
